<!DOCTYPE html>
<!-- The GitHub social preview, 1280 x 640. Render from the repo root with killer-repo's card.mjs:
       node card.mjs docs/card.html --out docs/assets/social.png
     The seal is docs/art/seal-still-dark.svg, the finished first run that make-seal.py draws. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Source Serif 4"; font-weight: 200 900; src: url(fonts/source-serif-4-latin.woff2) format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 200 900; src: url(fonts/source-sans-3-latin.woff2) format("woff2"); }
  @font-face { font-family: "Source Code Pro"; font-weight: 200 900; src: url(fonts/source-code-pro-latin.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 640px; background: #0C0D10; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 560px; align-items: center; gap: 40px; padding: 0 72px 0 88px; box-sizing: border-box; }
  h1 { margin: 0; font: 600 150px/0.9 "Source Serif 4", serif; font-variation-settings: "opsz" 60; color: #E8E6E1; letter-spacing: -0.025em; }
  p { margin: 30px 0 0; font: 600 38px/1.22 "Source Sans 3", sans-serif; color: #E8E6E1; max-width: 14em; }
  small { display: block; margin-top: 44px; font: 400 21px/1.5 "Source Code Pro", monospace; color: #8A8F99; }
  small b { color: #3DDC97; font-weight: 500; }
  img { display: block; width: 560px; height: 560px; }
</style>
</head>
<body>
  <div>
    <h1>certapi</h1>
    <p>mTLS API client for the Windows certificate store</p>
    <small>certapi doctor https://client.badssl.com/<br>six stages, <b>200 OK</b>, a real run</small>
  </div>
  <img src="art/seal-still-dark.svg" alt="">
</body>
</html>
