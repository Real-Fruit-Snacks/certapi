name        = "certapi"
description = "mTLS API client for the Windows certificate store"

[panel]
kind   = "flow"
status = ["ok key never left CurrentUser\\My"]

[panel.input]
label = "Client Cert"
note  = "Windows store"
chips = ["CurrentUser\\My"]
tone  = "steel-ink"

[panel.tool]
label = "certapi"
note  = "mTLS · C#"

[panel.output]
label = "API Response"
note  = "authenticated"
value = "200 OK"
tone  = "mint"
