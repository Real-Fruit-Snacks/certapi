<!-- certapi cover panel: certapi send with a store certificate, then serve --check, in their real
     output formats (OutputText.MetaLine, ServeSummary). Hosts, timings and sizes are examples.
     480x368, origin = panel top-left. Rendered by Real-Fruit-Snacks/rfs-brand tools/make-cover.py. -->
<rect width="480" height="368" fill="{code-bg}"/>
<rect width="480" height="34" fill="{surface}"/><rect y="34" width="480" height="1" fill="{line}"/>
<circle cx="20" cy="17" r="4.5" fill="{line}"/><circle cx="36" cy="17" r="4.5" fill="{line}"/><circle cx="52" cy="17" r="4.5" fill="{line}"/>
<rfs-text font="mono" size="12" x="240" y="21.5" anchor="middle" ls="0.5" fill="{mute}">pwsh</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="66" fill="{mute}">PS> </rfs-text>
<rfs-text font="mono" size="11" x="40.4" y="66" fill="{text}">certapi send </rfs-text>
<rfs-text font="mono" size="11" x="126.2" y="66" fill="{amber}">https://api.internal/orders</rfs-text>
<rfs-text font="mono" size="11" x="304.4" y="66" fill="{text}"> --cert </rfs-text>
<rfs-text font="mono" size="11" x="357.2" y="66" fill="{amber}">"CN=matt"</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="118" fill="{text}">{"order":"A-10422","status":"shipped"}</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="94" fill="{mint}">200 OK</rfs-text>
<rfs-text font="mono" size="11" x="53.6" y="94" fill="{mute}"> · 41 B · 48 ms · TLS 1.3 · </rfs-text>
<rfs-text font="mono" size="11" x="238.4" y="94" fill="{mint}">client cert presented</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="158" fill="{mute}">PS> </rfs-text>
<rfs-text font="mono" size="11" x="40.4" y="158" fill="{text}">certapi serve --port 8819 --cert </rfs-text>
<rfs-text font="mono" size="11" x="258.2" y="158" fill="{amber}">"CN=matt"</rfs-text>
<rfs-text font="mono" size="11" x="317.6" y="158" fill="{text}"> `</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="182" fill="{mute}">>>   </rfs-text>
<rfs-text font="mono" size="11" x="47.0" y="182" fill="{text}">--upstream api=https://api.corp `</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="206" fill="{mute}">>>   </rfs-text>
<rfs-text font="mono" size="11" x="47.0" y="206" fill="{text}">--upstream hr=https://hr.corp --check</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="236" fill="{mute}">  SITE  OPEN                        UPSTREAM          CERT  SETTINGS</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="260" fill="{text}">  api   http://127.0.0.1:8819/api/  https://api.corp  matt  -</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="284" fill="{text}">  hr    http://127.0.0.1:8819/hr/   https://hr.corp   matt  -</rfs-text>
<rfs-text font="mono" size="11" x="14.0" y="308" fill="{mute}">  every site: cert matt · no token · loopback only</rfs-text>
