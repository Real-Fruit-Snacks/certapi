name: Feature request
description: Propose a concrete local-first capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow gap and real inputs/outputs involved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Concrete CLI flags, UI controls, or file format you have in mind.
    validations:
      required: true
