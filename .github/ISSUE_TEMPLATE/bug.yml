name: Bug report
description: Report a reproducible defect or platform issue
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Plain description of the input, command or action, and actual output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `tool --version`
        2. Run `tool ...`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and version
      placeholder: "Windows 11 24H2 / Rust 1.84 / tool v1.0.0"
    validations:
      required: true
