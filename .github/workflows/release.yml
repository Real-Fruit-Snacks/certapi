name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish portable exe
    runs-on: windows-latest

    steps:
      # A manual run builds the tag it was given, not whatever branch it was dispatched from — the
      # binaries, the source zip and SHA256SUMS published under a tag must be that tag's. A tag that
      # does not exist fails here, before anything is built or created.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The exe reports the <Version> in its project; a tag that disagrees would make `certapi update`
      # and the app see this release as newer than themselves forever.
      - name: Check the projects carry the tag's version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          for proj in src/ApiTester.App/ApiTester.App.csproj src/ApiTester.Cli/ApiTester.Cli.csproj; do
            FOUND=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$proj" | head -1)
            if [ "$FOUND" != "$VERSION" ]; then
              echo "::error file=$proj::<Version> is '$FOUND' but the tag is $TAG — bump it before releasing."
              exit 1
            fi
          done

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test --configuration Release --filter "Category!=StoreRoundTrip"

      - name: Publish self-contained single-file exe
        run: |
          dotnet publish src/ApiTester.App -c Release -r win-x64 --self-contained -o publish
          dotnet publish src/ApiTester.Cli -c Release -r win-x64 --self-contained -o publish-cli
          # HTTP/3 needs msquic.dll beside each exe (a single-file publish leaves it out; see
          # src/MsQuicBesideExe.targets). Both exes are built from one runtime, so one file serves both.
          if ((Get-FileHash publish/msquic.dll).Hash -ne (Get-FileHash publish-cli/msquic.dll).Hash) { throw 'the app and the command line were published with different msquic.dll files' }

      - name: Bundle the full repository source
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: git archive --format=zip --prefix="certapi-${TAG}/" -o "certapi-source-${TAG}.zip" HEAD

      - name: Checksums and a Scoop manifest
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          CLI_SHA=$(sha256sum publish-cli/certapi.exe | cut -d' ' -f1)
          APP_SHA=$(sha256sum publish/ApiTester.App.exe | cut -d' ' -f1)
          QUIC_SHA=$(sha256sum publish-cli/msquic.dll | cut -d' ' -f1)
          WORDS_SHA=$(sha256sum wordlists/common-api-endpoints.txt | cut -d' ' -f1)
          {
            echo "${CLI_SHA}  certapi.exe"
            echo "${APP_SHA}  ApiTester.App.exe"
            echo "${QUIC_SHA}  msquic.dll"
            echo "${WORDS_SHA}  common-api-endpoints.txt"
          } > SHA256SUMS.txt
          # Installed with: scoop install https://github.com/<repo>/releases/latest/download/certapi.json
          cat > certapi.json <<JSON
          {
            "version": "${VERSION}",
            "description": "mTLS API client for the Windows certificate store",
            "homepage": "https://github.com/${GITHUB_REPOSITORY}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": ["${BASE}/certapi.exe", "${BASE}/ApiTester.App.exe", "${BASE}/msquic.dll"],
                "hash": ["${CLI_SHA}", "${APP_SHA}", "${QUIC_SHA}"]
              }
            },
            "bin": "certapi.exe",
            "shortcuts": [["ApiTester.App.exe", "certapi"]],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": [
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/v\$version/certapi.exe",
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/v\$version/ApiTester.App.exe",
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/v\$version/msquic.dll"
                  ]
                }
              },
              "hash": { "url": "\$baseurl/SHA256SUMS.txt" }
            }
          }
          JSON
          python -c "import json; json.load(open('certapi.json'))"
          cat SHA256SUMS.txt certapi.json

      - name: Compose release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Pull just this version's section (everything under "## [x.y.z]" up to the next "## [").
          awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} g&&/^## \[/{exit} g{print}' \
            CHANGELOG.md > notes-body.md
          sed -i '/./,$!d' notes-body.md            # drop leading blank lines
          if [ ! -s notes-body.md ]; then           # fallback if the section is missing
            printf 'See the [changelog](https://github.com/%s/blob/main/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" > notes-body.md
          fi
          # Reuse the compare link already maintained in the CHANGELOG footer.
          COMPARE=$(sed -n "s/^\[$VERSION\]: //p" CHANGELOG.md | head -1)
          if [ -n "$COMPARE" ]; then
            printf '\n**Full Changelog**: %s\n' "$COMPARE" >> notes-body.md
          fi
          echo '----- release notes preview -----'; cat notes-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "publish/ApiTester.App.exe#certapi desktop app (Windows x64, self-contained)" \
            "publish-cli/certapi.exe#certapi command line (Windows x64, self-contained)" \
            "publish-cli/msquic.dll#HTTP/3 (QUIC) library: keep it beside certapi.exe and ApiTester.App.exe" \
            "wordlists/common-api-endpoints.txt#Starter wordlist for certapi fuzz" \
            "certapi-source-${TAG}.zip#Source at this tag" \
            "SHA256SUMS.txt#SHA-256 of each file (certapi update checks against these)" \
            "certapi.json#Scoop manifest" \
            --title "$TAG" \
            --notes-file notes-body.md
