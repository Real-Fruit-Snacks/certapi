name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      # The release stops when the exes would bundle an older runtime than the newest 9.0 patch;
      # this says so here first, as a warning, so it is not news on release day.
      - name: Runtime the exes would bundle
        shell: pwsh
        run: |
          $latest = [version](Invoke-RestMethod https://builds.dotnet.microsoft.com/dotnet/release-metadata/9.0/releases.json).'latest-runtime'
          $out = dotnet msbuild src/ApiTester.Cli/ApiTester.Cli.csproj -nologo -t:ProcessFrameworkReferences -getItem:RuntimePack `
            -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:SelfContained=true | Out-String
          $json = $out.Substring($out.IndexOf('{'), $out.LastIndexOf('}') - $out.IndexOf('{') + 1)
          $pack = @(($json | ConvertFrom-Json).Items.RuntimePack | Where-Object Identity -eq 'Microsoft.NETCore.App.Runtime.win-x64')
          $bundled = [version]$pack[0].NuGetPackageVersion
          Write-Host "A release built now bundles .NET runtime $bundled (newest 9.0 patch: $latest, SDK $(dotnet --version))"
          if ($bundled -lt $latest) { Write-Host "::warning::A release built now would bundle .NET $bundled; $latest is out, and the release workflow will refuse it." }
        continue-on-error: true

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --filter "Category!=StoreRoundTrip" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
